<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AutoQuest • Discord</title>
<style>
  /* ===== RESET & NỀN ĐEN KHÓI ===== */
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',Tahoma,sans-serif; }
  body {
    min-height:100vh;
    background:
      radial-gradient(circle at 20% 20%, rgba(255,0,150,0.08), transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(255,100,0,0.08), transparent 40%),
      radial-gradient(circle at 50% 50%, #1a1a1a, #000 80%);
    color:#e0e0e0;
    display:flex; flex-direction:column; align-items:center;
    padding:30px 15px;
    overflow-x:hidden;
  }

  /* ===== TIÊU ĐỀ GRADIENT HỒNG TRẮNG CHUYỂN ĐỘNG ===== */
  .title {
    font-size:3.2rem; font-weight:900; letter-spacing:2px;
    background:linear-gradient(90deg,#ff5fa2,#ffffff,#ff8ec7,#ffffff,#ff5fa2);
    background-size:300% 100%;
    -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent;
    animation:gradientMove 4s linear infinite;
    text-align:center;
  }
  @keyframes gradientMove {
    0% { background-position:0% 50%; }
    100% { background-position:300% 50%; }
  }

  /* ===== TÊN PHỤ ORANGE GRADIENT FONT VUÔNG ===== */
  .subname {
    font-family:'Courier New',monospace;
    font-weight:700; letter-spacing:6px; font-size:0.95rem;
    background:linear-gradient(90deg,#ff7b00,#ffb347,#ff7b00);
    -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent;
    margin-top:6px; text-transform:uppercase;
  }

  /* ===== KHUNG CHUNG ===== */
  .panel {
    width:100%; max-width:620px;
    background:rgba(20,20,20,0.85);
    border:1px solid rgba(255,95,162,0.35);
    border-radius:14px;
    padding:22px 24px;
    margin-top:26px;
    box-shadow:0 0 25px rgba(255,95,162,0.15);
    backdrop-filter:blur(6px);
  }

  label { display:block; font-size:0.85rem; color:#ff8ec7; margin-bottom:8px; letter-spacing:1px; }

  input[type="password"], input[type="text"] {
    width:100%; padding:12px 14px;
    background:#0d0d0d; color:#fff;
    border:1px solid #333; border-radius:8px;
    font-size:0.95rem; outline:none;
    transition:0.2s;
  }
  input:focus { border-color:#ff5fa2; box-shadow:0 0 8px rgba(255,95,162,0.4); }

  button {
    cursor:pointer; border:none; border-radius:8px;
    padding:12px 20px; font-weight:700; letter-spacing:1px;
    font-size:0.95rem; transition:0.2s;
  }
  .btn-login {
    width:100%; margin-top:14px;
    background:linear-gradient(90deg,#ff5fa2,#ff8ec7);
    color:#000;
  }
  .btn-login:hover { filter:brightness(1.15); }
  .btn-start {
    width:100%; margin-top:18px;
    background:linear-gradient(90deg,#ff7b00,#ffb347);
    color:#000;
  }
  .btn-start:hover { filter:brightness(1.15); }

  /* ===== THANH THỐNG KÊ ===== */
  .stats { display:flex; gap:14px; margin-top:20px; }
  .stat-box {
    flex:1; text-align:center;
    background:#0d0d0d; border-radius:10px;
    padding:14px; border:1px solid #2a2a2a;
  }
  .stat-box .num { font-size:1.8rem; font-weight:900; }
  .stat-box .lbl { font-size:0.75rem; color:#999; margin-top:4px; letter-spacing:1px; }
  .done .num { color:#4caf50; }
  .pending .num { color:#ff9800; }

  /* ===== DANH SÁCH QUEST ===== */
  .quest-list { margin-top:20px; max-height:260px; overflow-y:auto; }
  .quest-item {
    display:flex; justify-content:space-between; align-items:center;
    background:#111; border:1px solid #222; border-radius:8px;
    padding:10px 14px; margin-bottom:8px; font-size:0.85rem;
  }
  .quest-item .name { color:#ddd; }
  .quest-item .status { font-size:0.75rem; padding:3px 8px; border-radius:5px; }
  .status.done { background:rgba(76,175,80,0.15); color:#4caf50; }
  .status.pending { background:rgba(255,152,0,0.15); color:#ff9800; }

  .log {
    margin-top:16px; font-family:'Courier New',monospace;
    font-size:0.78rem; color:#8ec7ff; background:#050505;
    border:1px solid #1a1a1a; border-radius:8px;
    padding:10px; height:130px; overflow-y:auto; white-space:pre-wrap;
  }

  /* ===== FOOTER ===== */
  footer {
    margin-top:40px; text-align:center;
    font-size:0.78rem; color:#777; line-height:1.6;
    max-width:620px;
  }
  footer .copy { color:#ff8ec7; }
  footer .disclaimer { margin-top:6px; }
  footer .disclaimer em strong { color:#ff5fa2; }
  .hidden { display:none; }
</style>
</head>
<body>

  <div class="title">AutoQuest • Discord</div>
  <div class="subname">Huy Hoangz</div>

  <!-- ===== BƯỚC 1: ĐĂNG NHẬP TOKEN ===== -->
  <div class="panel" id="loginPanel">
    <label>NHẬP TOKEN ACC DISCORD</label>
    <input type="password" id="tokenInput" placeholder="Dán token Discord của bạn vào đây...">
    <button class="btn-login" id="loginBtn">ĐĂNG NHẬP</button>
  </div>

  <!-- ===== BƯỚC 2: DASHBOARD ===== -->
  <div class="panel hidden" id="dashPanel">
    <label>TRẠNG THÁI TÀI KHOẢN</label>
    <div class="stats">
      <div class="stat-box done">
        <div class="num" id="doneCount">0</div>
        <div class="lbl">ĐÃ HOÀN THÀNH</div>
      </div>
      <div class="stat-box pending">
        <div class="num" id="pendingCount">0</div>
        <div class="lbl">CHƯA HOÀN THÀNH</div>
      </div>
    </div>

    <div class="quest-list" id="questList"></div>

    <button class="btn-start" id="startBtn">BẮT ĐẦU AUTO QUEST</button>
    <div class="log" id="logBox">[HỆ THỐNG] Sẵn sàng...</div>
  </div>

  <footer>
    <div class="copy">© Huy Hoangz - Hệ thống Auto Quest Discord</div>
    <div class="disclaimer">
      Mọi thông tin, Token,… Đều <em><strong>không</strong></em> được lưu trữ, chúng tôi xin từ chối mọi trách nhiệm ngoài ý muốn.
    </div>
  </footer>

<script>
/* ============================================================
   AutoQuest Discord - Huy Hoangz
   Toàn bộ xử lý token & quest diễn ra phía client.
   KHÔNG lưu trữ token dưới bất kỳ hình thức nào.
   ============================================================ */

const DISCORD_API = "https://discord.com/api/v9";

let userToken = "";
let quests = [];

const $ = (id) => document.getElementById(id);

function log(msg) {
  const box = $("logBox");
  const time = new Date().toLocaleTimeString();
  box.textContent += `\n[${time}] ${msg}`;
  box.scrollTop = box.scrollHeight;
}

/* ---------- BƯỚC 1: ĐĂNG NHẬP ---------- */
$("loginBtn").addEventListener("click", async () => {
  const token = $("tokenInput").value.trim();
  if (!token) { alert("Vui lòng nhập Token Discord."); return; }

  userToken = token;
  log("Đang xác thực token...");

  try {
    const res = await fetch(`${DISCORD_API}/users/@me`, {
      headers: { "Authorization": userToken }
    });

    if (!res.ok) throw new Error("Token không hợp lệ hoặc đã hết hạn.");

    const user = await res.json();
    log(`Đăng nhập thành công: ${user.username}#${user.discriminator || "0"}`);

    $("loginPanel").classList.add("hidden");
    $("dashPanel").classList.remove("hidden");

    await loadQuests();
  } catch (err) {
    log(`LỖI: ${err.message}`);
    alert("Đăng nhập thất bại: " + err.message);
  }
});

/* ---------- BƯỚC 2: LẤY DANH SÁCH QUEST ---------- */
async function loadQuests() {
  log("Đang lấy danh sách nhiệm vụ từ Discord...");
  try {
    const res = await fetch(`${DISCORD_API}/quests/@me`, {
      headers: { "Authorization": userToken }
    });

    if (!res.ok) throw new Error("Không thể tải quest (HTTP " + res.status + ")");

    const data = await res.json();
    quests = data.quests || data || [];

    if (!Array.isArray(quests)) quests = [];

    renderQuests();
    log(`Đã tải ${quests.length} nhiệm vụ.`);
  } catch (err) {
    log(`LỖI tải quest: ${err.message}`);
    // Fallback dữ liệu mẫu nếu API chặn CORS
    quests = [
      { id:"q1", config:{ messages:{ name:"Play a Game" } }, user_status:{ completed:false } },
      { id:"q2", config:{ messages:{ name:"Watch Video" } }, user_status:{ completed:true } },
      { id:"q3", config:{ messages:{ name:"Stream 15 min" } }, user_status:{ completed:false } }
    ];
    renderQuests();
    log("Dùng dữ liệu mẫu (API bị chặn CORS).");
  }
}

/* ---------- HIỂN THỊ QUEST ---------- */
function renderQuests() {
  const list = $("questList");
  list.innerHTML = "";

  let done = 0, pending = 0;

  quests.forEach(q => {
    const isDone = q.user_status?.completed === true;
    if (isDone) done++; else pending++;

    const name = q.config?.messages?.name || q.config?.application?.name || q.id;

    const item = document.createElement("div");
    item.className = "quest-item";
    item.innerHTML = `
      <span class="name">${name}</span>
      <span class="status ${isDone ? "done" : "pending"}">
        ${isDone ? "ĐÃ XONG" : "CHƯA XONG"}
      </span>
    `;
    list.appendChild(item);
  });

  $("doneCount").textContent = done;
  $("pendingCount").textContent = pending;
}

/* ---------- BƯỚC 3: AUTO QUEST ---------- */
$("startBtn").addEventListener("click", async () => {
  const pendingQuests = quests.filter(q => !q.user_status?.completed);

  if (pendingQuests.length === 0) {
    log("Không có nhiệm vụ nào cần hoàn thành.");
    return;
  }

  log(`Bắt đầu Auto Quest cho ${pendingQuests.length} nhiệm vụ...`);

  for (const q of pendingQuests) {
    const name = q.config?.messages?.name || q.id;
    log(`Đang xử lý: ${name}`);

    try {
      // Gửi yêu cầu hoàn thành quest (endpoint nội bộ Discord)
      const res = await fetch(`${DISCORD_API}/quests/${q.id}/claim`, {
        method: "POST",
        headers: {
          "Authorization": userToken,
          "Content-Type": "application/json"
        }
      });

      if (res.ok) {
        q.user_status = { completed: true };
        log(`✔ Hoàn thành: ${name}`);
      } else {
        log(`✘ Thất bại (${res.status}): ${name}`);
      }
    } catch (err) {
      log(`✘ Lỗi mạng: ${name} - ${err.message}`);
    }

    // Nghỉ ngắn tránh rate-limit
    await new Promise(r => setTimeout(r, 800));
  }

  renderQuests();
  log("Hoàn tất quá trình Auto Quest.");
});
</script>
</body>
</html>
