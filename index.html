<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AutoQuest • Discord</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="title">AutoQuest • Discord</div>
  <div class="subname">Huy Hoangz</div>

  <div class="panel" id="loginPanel">
    <label>NHẬP TOKEN ACC DISCORD</label>
    <input type="password" id="tokenInput" placeholder="Dán token Discord của bạn vào đây...">

    <div class="api-config">
      <label>ĐỊA CHỈ API BACKEND</label>
      <input type="text" id="apiInput" value="http://localhost:3000" placeholder="http://localhost:3000">
    </div>

    <button class="btn-login" id="loginBtn">ĐĂNG NHẬP</button>
  </div>

  <div class="panel hidden" id="dashPanel">
    <label>TRẠNG THÁI TÀI KHOẢN</label>
    <div class="stats">
      <div class="stat-box done">
        <div class="num" id="doneCount">0</div>
        <div class="lbl">ĐÃ HOÀN THÀNH</div>
      </div>
      <div class="stat-box pending">
        <div class="num" id="pendingCount">0</div>
        <div class="lbl">CHƯA HOÀN THÀNH</div>
      </div>
    </div>

    <div class="quest-list" id="questList"></div>

    <button class="btn-start" id="startBtn">BẮT ĐẦU AUTO QUEST</button>
    <div class="log" id="logBox">[HỆ THỐNG] Sẵn sàng...</div>
  </div>

  <footer>
    <div class="copy">© Huy Hoangz - Hệ thống Auto Quest Discord</div>
    <div class="disclaimer">
      Mọi thông tin, Token,… Đều <em><strong>không</strong></em> được lưu trữ, chúng tôi xin từ chối mọi trách nhiệm ngoài ý muốn.
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
